{{- /*
Token de las aprobaciones (docs/adr/0009-panel-de-operacion.md). Se monta solo en el ejecutor y en el
panel; el agente no lo tiene y su ServiceAccount no puede leer Secrets. Se conserva entre actualizaciones.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "autokub-approval" }}
{{- $token := randAlphaNum 48 }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: autokub-approval
  namespace: {{ .Release.Namespace }}
  labels: {{- include "autokub.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
