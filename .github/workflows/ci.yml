# Mismas comprobaciones que en local: make lint y make test (no necesitan clúster).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Misma versión que infra/bootstrap/install-k8s-tools.sh
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: promtool (Prometheus 3.16.0, checksum verificado)
        run: |
          curl -fsSL -o /tmp/prom.tgz https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz
          echo "68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34  /tmp/prom.tgz" | sha256sum -c -
          tar -xzf /tmp/prom.tgz -C /tmp
          sudo install -m 0755 /tmp/prometheus-3.16.0.linux-amd64/promtool /usr/local/bin/promtool

      - name: Herramientas
        run: pip install ruff==0.17.4

      - name: Entorno del agente
        run: make venv

      - name: Lint
        run: make lint

      - name: Tests
        run: make test
