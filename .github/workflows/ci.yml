# Mismas comprobaciones que en local: make lint y make test (no necesitan clúster).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Misma versión que infra/bootstrap/install-k8s-tools.sh
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.22.0

      - name: Herramientas
        run: pip install ruff==0.17.4

      - name: Entorno del agente
        run: make venv

      - name: Lint
        run: make lint

      - name: Tests
        run: make test
