# Al crear un tag vX.Y.Z: comprueba todo, publica las imágenes (amd64 y arm64) y el chart en GHCR
# y crea la release en GitHub. Las imágenes se construyen aquí, no en ninguna máquina local.
name: release

on:
  push:
    tags: ["v*.*.*"]

# Sin permisos por defecto: cada trabajo pide solo lo que necesita
permissions: {}

env:
  REGISTRY: ghcr.io/marcosperezcantero

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: pip install ruff==0.17.4
      - run: make venv
      - run: make lint
      - run: make test
      - name: La versión del tag coincide con la del chart
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version: //p' charts/autokub/Chart.yaml)"
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/autokub/Chart.yaml)"

  images:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [agent, executor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # El chart usa appVersion (0.1.0) como etiqueta de las imágenes, sin la "v" del tag
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/autokub-${{ matrix.component }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}

  publish:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # crear la release
      packages: write   # publicar el chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Chart en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf %s "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          helm package charts/autokub -d dist
          helm push dist/autokub-${GITHUB_REF_NAME#v}.tgz oci://${{ env.REGISTRY }}/charts
      - name: Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md no tiene sección para $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "autokub $GITHUB_REF_NAME" --notes-file notes.md
