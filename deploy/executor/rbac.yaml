# Identidad del ejecutor: el único componente con permisos de escritura sobre el clúster.
# Segunda barrera tras OPA: acota el daño posible aunque la política tuviera un error.
# Sin acceso a Secrets, sin verbos de borrado y limitado al namespace otel-demo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autokub-executor
  namespace: otel-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autokub-executor
  namespace: otel-demo
rules:
  # Deployments de la aplicación: la misma lista que allowed_targets en policies/remediation.rego
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames:
      - ad
      - cart
      - checkout
      - currency
      - email
      - frontend
      - payment
      - product-catalog
      - quote
      - recommendation
      - shipping
  # Lectura para obtener los hechos del clúster y localizar la revisión anterior
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autokub-executor
  namespace: otel-demo
subjects:
  - kind: ServiceAccount
    name: autokub-executor
    namespace: otel-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autokub-executor
