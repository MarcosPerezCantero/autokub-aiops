# Identidad del detector y del agente: solo lectura, sin Secrets.
# Lo que propongan solo llega al clúster a través del ejecutor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autokub-reader
  namespace: otel-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autokub-reader
  namespace: otel-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autokub-reader
  namespace: otel-demo
subjects:
  - kind: ServiceAccount
    name: autokub-reader
    namespace: otel-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autokub-reader
